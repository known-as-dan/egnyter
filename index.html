  * { box-sizing: border-box; }

  html { height: 100%; }

  body {
    /* min-height, not height: on short viewports the body must grow with its
       content so the bottom padding stays inside the scrollable area. */
    min-height: 100%;
    margin: 0;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Hebrew",
                 "Arial Hebrew", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    -webkit-text-size-adjust: 100%;
  }

  .card {
    /* Auto block margins absorb the free space, so the card sits centred in
       whatever room is left above the footer, and the footer sits at the
       bottom of the viewport. Both collapse to 0 once content fills it. */
    margin-block: auto;
    width: 100%;
    max-width: 460px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
  }

  h1 {
    margin: 0 0 4px;
    font-size: 1.15rem;
    font-weight: 600;
  }

  p { margin: 0 0 16px; }

  .muted {
    color: var(--muted);
    font-size: 0.875rem;
  }

  .url {
    display: block;
    direction: ltr;
    text-align: left;
    unicode-bidi: isolate;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 0.8125rem;
    line-height: 1.45;
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    margin: 0 0 20px;
    overflow-wrap: anywhere;
    word-break: break-all;
    user-select: all;
  }

  .actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 18px;
  }

  .btn {
    display: block;
    padding: 12px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    text-align: center;
    text-decoration: none;
    font-size: 0.9375rem;
    font-weight: 600;
    color: var(--text);
    background: transparent;
    transition: filter 0.12s ease, background-color 0.12s ease;
  }

  .btn:hover { background: var(--code-bg); }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-text);
  }

  .btn-primary:hover { filter: brightness(1.08); background: var(--accent); }

  .btn:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }

  .note {
    margin: 0;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.8125rem;
  }

  .error h1 { color: var(--error); }

  /* Egnyte wordmark standing in for the word "Egnyte" in the heading. Its
     lettering is fill="currentColor" so it takes the heading colour in both
     themes; the star keeps Egnyte's teal. */
  .egnyte-mark {
    height: 0.95em;
    width: auto;
    vertical-align: -0.1em;
    margin-inline-start: 0.12em;
  }

  /* "Shiny Pages" credit watermark with a periodic shine sweep, mirroring the
     treatment on meshekalexander.com and in Mikumit. The sweep is a masked
     diagonal gradient clipped to the logo's own silhouette. */
  .credit {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 4px 8px;
    padding-top: 24px;
    color: var(--muted);
    font-size: 0.75rem;
  }

  .shiny {
    position: relative;
    display: inline-block;
    overflow: hidden;
    border-radius: 4px;
    transition: transform 0.2s ease;
  }

  .shiny:hover, .shiny:focus-visible { transform: translateY(-2px); }

  .shiny:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 3px;
  }

  .shiny__mark {
    display: block;
    height: 1.75rem;
    aspect-ratio: var(--logo-ar);
    background: var(--logo) center / contain no-repeat;
  }

  .shiny::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(110deg,
      transparent 35%, rgba(255, 255, 255, 0.85) 50%, transparent 65%);
    background-size: 250% 100%;
    background-repeat: no-repeat;
    background-position: 180% 0;
    -webkit-mask: var(--logo) center / contain no-repeat;
    mask: var(--logo) center / contain no-repeat;
    mix-blend-mode: screen;
    animation: shiny-sweep 5s ease-in-out infinite;
  }

  @keyframes shiny-sweep {
    0%, 15% { background-position: 180% 0; }
    55%, 100% { background-position: -80% 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<main class="card" id="card">
  <div id="content" aria-live="polite">
    <noscript>
      <h1>נדרש JavaScript</h1>
      <p class="muted">הדף הזה בונה את הקישורים בדפדפן. יש להפעיל JavaScript.</p>
    </noscript>
  </div>
</main>

    <span class="shiny__mark"></span>
  </a>
</footer>

<script>
(function () {
  "use strict";

  var PATTERN = /^(https?|egnyte):\/\/[a-z0-9-]+\.egnyte\.com\/[^\s]*$/;

  var card = document.getElementById("card");
  var content = document.getElementById("content");

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function renderError() {
    card.className = "card error";
    content.appendChild(el("h1", null, "קישור לא תקין"));
    content.appendChild(el("p", null, "לא התקבלה כתובת Egnyte תקינה."));
    content.appendChild(el("p", "muted", "המבנה הצפוי:"));
    content.appendChild(el("code", "url", location.origin + location.pathname +
      "?u=https://<domain>.egnyte.com/navigate/folder/<id>"));
    content.appendChild(el("p", "note", "יש לוודא שהערך של הפרמטר u מקודד (ENCODEURL) ומצביע לדומיין egnyte.com."));
  }

  function render(appUrl, webUrl) {
    var heading = el("h1", null, "פתיחת תיקייה ב־");
    var mark = document.getElementById("egnyte-mark");
    var svg = mark && mark.content && mark.content.firstElementChild;
    heading.appendChild(svg ? svg.cloneNode(true) : document.createTextNode("Egnyte"));
    content.appendChild(heading);
    content.appendChild(el("p", "muted", "בחר/י כיצד לפתוח את הקישור:"));

    var code = el("code", "url", webUrl);
    content.appendChild(code);

    var actions = el("div", "actions");

    var app = el("a", "btn btn-primary", "פתיחה באפליקציית Egnyte");
    app.setAttribute("href", appUrl);
    actions.appendChild(app);

    var web = el("a", "btn", "פתיחה בדפדפן");
    web.setAttribute("href", webUrl);
    web.setAttribute("target", "_blank");
    web.setAttribute("rel", "noopener");
    actions.appendChild(web);

    content.appendChild(actions);

    content.appendChild(el("p", "note",
      "פתיחה באפליקציה דורשת שאפליקציית Egnyte Desktop App מותקנת ושמוגדר בה כונן שמכסה את הנתיב הזה."));

    app.focus();
  }

  var raw;
  try {
    raw = new URLSearchParams(location.search).get("u");
  } catch (e) {
    raw = null;
  }

  var value = (raw || "").trim();

  if (!value || !PATTERN.test(value)) {
    renderError();
    return;
  }

  var rest = value.slice(value.indexOf("://") + 3);
  render("egnyte://" + rest, "https://" + rest);
})();
</script>
</body>
</html>
